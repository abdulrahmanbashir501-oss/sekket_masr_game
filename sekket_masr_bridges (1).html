<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>سكة مصر - محاكي القطارات</title>
<style>
:root{--fg:#eaf2ff;--ac:#ffb020;--pn:rgba(10,18,32,.78);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#05080f;font-family:system-ui,sans-serif;color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,rgba(4,9,22,.5),rgba(4,9,22,.82));overflow:auto;text-align:center;padding:16px;z-index:5}
.ov[hidden],#hud[hidden]{display:none}
h1{font-size:clamp(34px,8vw,74px);margin:0;letter-spacing:.08em;text-shadow:0 4px 24px #000}h1 b{color:var(--ac)}
h2{margin:0}.sub{opacity:.8;margin:0 0 8px}
.btn{background:linear-gradient(#ffc247,#f08a00);color:#1a1000;border:0;border-radius:12px;padding:13px 26px;font-size:18px;font-weight:700;min-width:240px;cursor:pointer}
.btn.g{background:var(--pn);color:var(--fg);border:1px solid #456}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{background:var(--pn);border:2px solid #345;border-radius:14px;padding:14px;width:190px;cursor:pointer;font-size:14px}.card.sel{border-color:var(--ac)}.card b{font-size:17px;display:block;margin-bottom:6px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;width:min(420px,90vw)}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#top div,.tb{background:var(--pn);border-radius:10px;padding:6px 10px;font-size:14px}
#sub{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));max-width:86vw;background:var(--pn);padding:8px 14px;border-radius:10px;text-align:center;opacity:0;transition:opacity .3s}
#warn{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top,0px));color:#ff6a50;font-weight:800;font-size:20px;text-shadow:0 2px 8px #000;text-align:center}
#gz{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.bar{width:12px;height:90px;background:#0008;border-radius:6px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;right:0;bottom:0;background:#4c8;height:0}.bar.b i{background:#e54}
.tb{position:fixed;border:1px solid rgba(190,211,225,.52);color:#f4f8fc;font-weight:800;min-width:64px;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;letter-spacing:.06em;cursor:pointer;background:linear-gradient(145deg,rgba(48,62,74,.96),rgba(9,17,25,.98));box-shadow:inset 0 2px 2px #ffffff25,inset 0 -4px 8px #0009,0 5px 14px #0009;text-shadow:0 1px 3px #000;backdrop-filter:blur(8px);transition:filter .12s,transform .12s}
.tb.on{filter:brightness(1.5);transform:translateY(2px);box-shadow:inset 0 3px 8px #0009,0 1px 4px #0008}
#gas{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:94px;height:94px;border-radius:50%;border:2px solid #82d9b0;background:radial-gradient(circle at 35% 25%,#54c58a,#12633f 65%,#092d20);font-size:14px;box-shadow:inset 0 3px 7px #ffffff55,inset 0 -8px 14px #001b12,0 6px 18px #000b}
#brk{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:94px;height:94px;border-radius:50%;border:2px solid #ff9c91;background:radial-gradient(circle at 35% 25%,#e9685c,#8c211e 65%,#3a0d0b);font-size:14px;box-shadow:inset 0 3px 7px #ffffff55,inset 0 -8px 14px #210605,0 6px 18px #000b}
#rev{left:10px;bottom:calc(124px + env(safe-area-inset-bottom,0px))}#hn{right:10px;bottom:calc(124px + env(safe-area-inset-bottom,0px))}
#cm{right:80px;bottom:calc(124px + env(safe-area-inset-bottom,0px))}#dr{left:80px;bottom:calc(124px + env(safe-area-inset-bottom,0px))}
#ps{right:8px;top:calc(8px + env(safe-area-inset-top,0px));min-width:44px}#wx{right:60px;top:calc(8px + env(safe-area-inset-top,0px));min-width:44px}
#cabpanel{position:fixed;left:8px;top:calc(58px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px;background:linear-gradient(145deg,rgba(23,34,44,.96),rgba(4,10,17,.96));border:1px solid #71899a;border-radius:10px;padding:10px;min-width:148px;pointer-events:auto;box-shadow:0 8px 24px #0009,inset 0 1px #ffffff20;backdrop-filter:blur(10px)}
#cabpanel .ct{font-size:10px;color:#c4d6e2;font-weight:900;letter-spacing:.16em;text-align:center;border-bottom:1px solid #536777;padding-bottom:6px}
#cabpanel .cr{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:11px;color:#c5d2dc}
#cabpanel button{background:linear-gradient(#536777,#1a2b38);color:#f2f7fb;border:1px solid #91a8b8;border-radius:5px;padding:6px 10px;font-weight:900;min-width:34px;box-shadow:inset 0 1px #ffffff35,0 2px 4px #0008}
#cabpanel b{min-width:28px;text-align:center;color:#f7c66a;font-variant-numeric:tabular-nums}
#cabpanel button:active{background:linear-gradient(#f2c36b,#9b6a25);color:#111;transform:translateY(1px)}
@media(max-width:700px){#cabpanel{top:calc(54px + env(safe-area-inset-top,0px));transform:scale(.88);transform-origin:top left;left:2px}#gz{transform:translateX(-50%) scale(.82);transform-origin:bottom center}}
#wiperfx{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:1;background:repeating-linear-gradient(105deg,transparent 0 38px,rgba(160,210,255,.18) 39px,transparent 41px 78px);mix-blend-mode:screen;transition:opacity .3s}
#wiperfx.on{opacity:.35;animation:rainmove .22s linear infinite}
@keyframes rainmove{to{background-position:0 45px}}
@media(min-width:900px){#gas,#brk{width:80px;height:80px}}

#ui{background:radial-gradient(ellipse at 50% 20%,rgba(24,76,105,.52),transparent 55%),linear-gradient(145deg,rgba(3,9,19,.94),rgba(5,16,29,.97));backdrop-filter:blur(9px)}
#ui h1{letter-spacing:0;font-weight:950;background:linear-gradient(90deg,#fff,#ffd16a,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
#ui .sub{color:#c5d7e8}
#ui .btn{box-shadow:0 8px 24px #0007,inset 0 1px #fff8;transition:transform .15s,filter .15s}
#ui .btn:active{transform:scale(.97);filter:brightness(1.15)}
#ui .card{background:linear-gradient(145deg,rgba(20,44,62,.96),rgba(7,17,29,.96));border:1px solid #527087;box-shadow:0 8px 22px #0006;transition:.18s}
#ui .card.sel,#ui .card:hover{border-color:#ffc04d;transform:translateY(-3px);box-shadow:0 10px 26px #0009,0 0 0 1px #ffc04d44}
.menuStats{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.menuStats span{border:1px solid #42647b;background:#10283b;padding:7px 12px;border-radius:10px;font-size:12px;color:#e7f4ff}
.menuGrid{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.menuGrid .btn{min-width:190px}
.menuHint{max-width:590px;border-top:1px solid #446176;padding-top:10px;font-size:12px;line-height:1.8;color:#c7d8e6}
@media(max-width:600px){.menuGrid{width:100%}.menuGrid .btn{min-width:min(42vw,190px);font-size:15px;padding:12px 10px}.menuStats span{font-size:11px}}
.flagbar{width:min(420px,88vw);height:12px;border-radius:6px;background:linear-gradient(#ce1126 0 33.3%,#fff 33.3% 66.6%,#111 66.6%);box-shadow:0 2px 10px #000a;margin:2px auto}
#dec{z-index:7;background:linear-gradient(180deg,rgba(4,9,22,.7),rgba(4,9,22,.9))}#dec .sub{font-size:19px;max-width:min(520px,88vw);line-height:1.8;opacity:1}#dec .btn{min-width:min(420px,88vw);font-size:16px}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.4) 100%)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);transition:transform .4s;z-index:9;background:#0b1a14ee;border:1px solid #ffcf70;border-radius:14px;padding:10px 22px 12px;color:#fff;font-weight:800;text-align:center;min-width:230px;pointer-events:none}#toast.on{transform:translate(-50%,0)}

document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;if(k=='horn')hornOn();b.classList.add('on')});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{K[k]=0;if(k=='horn')hornOff();b.classList.remove('on')}))});
$('rev').onclick=toggleDir;$('dr').onclick=toggleDoors;$('cm').onclick=camN;$('ps').onclick=togglePause;$('wx').onclick=toggleWx;$('wiper').onclick=()=>{G.wipers=!G.wipers};
document.getElementById('cabpanel').addEventListener('click',e=>{const b=e.target.closest('[data-cab]');if(!b)return;const a=b.dataset.cab;if(a==='powerUp')G.power=Math.min(4,G.power+1);if(a==='powerDown')G.power=Math.max(0,G.power-1);if(a==='brakeUp')G.brake=Math.min(4,G.brake+1);if(a==='brakeDown')G.brake=Math.max(0,G.brake-1);});
const KM={KeyW:'gas',ArrowUp:'gas',KeyS:'brk',ArrowDown:'brk',Space:'brk',KeyH:'horn'};
addEventListener('keydown',e=>{if(e.repeat)return;if(G.dec){const m=/^Digit([1-9])$/.exec(e.code);if(m)pickDec(+m[1]-1);return}if(e.code==='KeyD')G.power=Math.min(4,G.power+1);if(e.code==='KeyA')G.power=Math.max(0,G.power-1);if(e.code==='KeyX')G.brake=Math.min(4,G.brake+1);if(e.code==='KeyZ')G.brake=Math.max(0,G.brake-1);if(e.code==='KeyV')G.wipers=!G.wipers;const k=KM[e.code];if(k){K[k]=1;if(k=='horn')hornOn();e.preventDefault()}if(!G.on)return;if(e.code=='KeyR')toggleDir();if(e.code=='KeyC')camN();if(e.code=='KeyE')toggleDoors();if(e.code=='KeyP'||e.code=='Escape')togglePause()});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){K[k]=0;if(k=='horn')hornOff()}});
/* ---------- main loop ---------- */
let last=performance.now(),T0=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T0+=dt;
 if(G.on&&!G.pause)sim(dt);if(!G.on||!G.pause){pose();const df=env(dt);camUpdate(dt,T0);audio(dt,df);if(G.on)hud()}if(WG.userData.wm)WG.userData.wm.material.map.offset.x+=.00012;FL.forEach((f,i)=>f.rotation.y=Math.sin(T0*2.2+i*1.7)*.22);R.render(S,cam)}
build();reset(false);scr('home');requestAnimationFrame(loop);
</script></body></html>
