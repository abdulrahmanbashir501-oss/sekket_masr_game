<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سكة مصر - محاكي القطارات (النسخة الواقعية HD)</title>
<style>
:root{--fg:#eaf2ff;--ac:#ffb020;--pn:rgba(10,18,32,.85);box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020408;font-family:system-ui,sans-serif;color:var(--fg);touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at center, rgba(10,20,40,0.65), rgba(2,5,12,0.95));backdrop-filter:blur(12px);z-index:5;text-align:center}
.ov[hidden],#hud[hidden]{display:none}
h1{font-size:clamp(36px,7vw,72px);margin:0;letter-spacing:.05em;text-shadow:0 6px 30px rgba(0,0,0,0.9);background:linear-gradient(180deg,#fff,#ffb020);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:linear-gradient(135deg,#ffc247,#f08a00);color:#110a00;border:0;border-radius:12px;padding:14px 32px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(240,138,0,0.4);transition:transform .15s}
.btn:active{transform:scale(0.96)}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;pointer-events:none;z-index:2}
#top div{background:var(--pn);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:8px 14px;font-size:15px;backdrop-filter:blur(8px)}
.tb{position:fixed;border:1px solid rgba(255,255,255,0.2);color:#fff;font-weight:800;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(circle at 35% 25%,rgba(55,75,95,0.9),rgba(12,22,32,0.95));box-shadow:0 8px 20px rgba(0,0,0,0.6);backdrop-filter:blur(6px);z-index:2}
#gas{right:16px;bottom:20px;width:90px;height:90px;border-color:#54c58a;background:radial-gradient(circle at 35% 25%,#45b378,#125233)}
#brk{left:16px;bottom:20px;width:90px;height:90px;border-color:#e9685c;background:radial-gradient(circle at 35% 25%,#d85347,#6e1916)}
#cam{right:120px;bottom:20px;width:60px;height:60px;border-radius:14px}
#wx{left:120px;bottom:20px;width:60px;height:60px;border-radius:14px}
#vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 100px rgba(0,0,0,0.7);z-index:1}
</style>
<!-- Three.js Engine & Controls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="top">
  <div id="sp">السرعة: 0 كم/س</div>
  <div id="sig">الإشارة: قادمة</div>
</div>

<div id="gas" class="tb">تسريع</div>
<div id="brk" class="tb">فرامل</div>
<div id="cam" class="tb">كاميرا</div>
<div id="wx" class="tb">طقس</div>

<div id="ui" class="ov">
  <h1>سكة مصر <b>HD</b></h1>
  <p style="color:#a0b0c0;max-width:400px">محاكي قطارات مصرية بجرافيك واقعي متطور، إضاءة فيزيائية، وضباب ديناميكي.</p>
  <button class="btn" onclick="startGame()">ابدأ الرحلة</button>
</div>

<script>
let scene, camera, renderer, train, speed = 0, targetSpeed = 0;
let lights = [], weatherMode = 0; // 0: Day, 1: Sunset, 2: Night

function initEngine() {
    const canvas = document.getElementById('c');
    
    // 1. Renderer مع PBR ToneMapping والظلال الناعمة
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    // 2. Scene & Camera
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, -12);

    // 3. Realistic Lighting (إضاءة فيزيائية)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 2.5);
    sunLight.position.set(50, 80, 50);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 300;
    const d = 40;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // 4. إنشاء البيئة والقطار
    buildEnvironment();
    buildTrain();

    // Events
    window.addEventListener('resize', onWindowResize);
    setupControls();

    // Loop
    animate();
}

// بناء البيئة الواقعية (النيل، الجسر، القضبان)
function buildEnvironment() {
    // أرضية / نهر النيل (مادة عاكسة)
    const waterGeo = new THREE.PlaneGeometry(1000, 1000);
    const waterMat = new THREE.MeshStandardMaterial({
        color: 0x0f3854,
        roughness: 0.1,
        metalness: 0.8
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -2;
    scene.add(water);

    // جسم الجسر الخرساني
    const bridgeGeo = new THREE.BoxGeometry(10, 2, 1000);
    const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
    const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
    bridge.position.set(0, -1, 0);
    bridge.receiveShadow = true;
    scene.add(bridge);

    // القضبان الحديدية (Metallic Rails)
    const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.2 });
    for (let side of [-1.2, 1.2]) {
        const railGeo = new THREE.BoxGeometry(0.15, 0.2, 1000);
        const rail = new THREE.Mesh(railGeo, railMat);
        rail.position.set(side, 0.1, 0);
        rail.castShadow = true;
        scene.add(rail);
    }

    // شريط الفلنكات الخشبية
    const sleeperGeo = new THREE.BoxGeometry(3, 0.15, 0.4);
    const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.8 });
    for (let z = -500; z < 500; z += 2) {
        const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
        sleeper.position.set(0, 0.05, z);
        sleeper.receiveShadow = true;
        scene.add(sleeper);
    }
}

// بناء جرار قطارات مصر المميز (VIP / الترانزيت) بجودة عالية
function buildTrain() {
    train = new THREE.Group();

    // هيكل الجرار الرئيسي
    const bodyGeo = new THREE.BoxGeometry(2.6, 2.8, 8);
    const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x224477, // اللون الأزرق والأسود لقطارات هيئة سكة حديد مصر
        metalness: 0.5,
        roughness: 0.3
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.6;
    body.castShadow = true;
    train.add(body);

    // خط سكة حديد مصر الأصفر الذهبي (Stripe)
    const stripeGeo = new THREE.BoxGeometry(2.62, 0.4, 8.01);
    const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffb020, metalness: 0.3, roughness: 0.4 });
    const stripe = new THREE.Mesh(stripeGeo, stripeMat);
    stripe.position.y = 1.4;
    train.add(stripe);

    // كشافات القطار الإمامية (SpotLight واقعية)
    const headlight = new THREE.SpotLight(0xffedd4, 5);
    headlight.position.set(0, 2, 4);
    headlight.target.position.set(0, 0, 50);
    headlight.angle = Math.PI / 6;
    headlight.penumbra = 0.4;
    headlight.castShadow = true;
    train.add(headlight);
    train.add(headlight.target);

    // عدسات الكشاف الظاهرة
    const lampGeo = new THREE.SphereGeometry(0.2, 16, 16);
    const lampMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for(let x of [-0.8, 0.8]) {
        const lamp = new THREE.Mesh(lampGeo, lampMat);
        lamp.position.set(x, 1.2, 4.01);
        train.add(lamp);
    }

    scene.add(train);
}

// عناصر التحكم والسرعة
function setupControls() {
    document.getElementById('gas').addEventListener('pointerdown', () => targetSpeed = 120);
    document.getElementById('gas').addEventListener('pointerup', () => targetSpeed = speed);
    document.getElementById('brk').addEventListener('pointerdown', () => targetSpeed = 0);
    
    // تغيير الطقس والبيئة واقعياً
    document.getElementById('wx').addEventListener('click', toggleWeather);
}

function toggleWeather() {
    weatherMode = (weatherMode + 1) % 3;
    if (weatherMode === 0) { // نهار
        scene.background.setHex(0x87ceeb);
        scene.fog.color.setHex(0x87ceeb);
        renderer.toneMappingExposure = 1.2;
    } else if (weatherMode === 1) { // غروب
        scene.background.setHex(0xd96b27);
        scene.fog.color.setHex(0xd96b27);
        renderer.toneMappingExposure = 0.9;
    } else { // ليل
        scene.background.setHex(0x02050c);
        scene.fog.color.setHex(0x02050c);
        renderer.toneMappingExposure = 0.5;
    }
}

function startGame() {
    document.getElementById('ui').hidden = true;
    initEngine();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// حلقة التحديث والتنعيم (Smooth Animation Loop)
function animate() {
    requestAnimationFrame(animate);

    // تنعيم تسارع وسرعة القطار (Physics Smoothing)
    speed += (targetSpeed - speed) * 0.03;
    document.getElementById('sp').innerText = `السرعة: ${Math.round(speed)} كم/س`;

    if (train) {
        train.position.z += speed * 0.005;
        
        // متابعة الكاميرا السلسة للقطار
        camera.position.z = train.position.z - 14;
        camera.position.y = train.position.y + 5;
        camera.lookAt(train.position.x, train.position.y + 1.5, train.position.z + 10);
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
